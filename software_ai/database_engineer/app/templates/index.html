<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JARVIS Knowledge Matrix</title>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Google Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                background: radial-gradient(circle at top, rgba(0, 229, 255, 0.1), transparent 40%), #0a0f1f;
                min-height: 100vh;
                color: #ffffff;
            }

            .stark-title {
                font-family: 'Orbitron', sans-serif;
                color: #00e5ff;
                letter-spacing: 3px;
                text-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
            }

            .jarvis-card {
                background: rgba(20, 27, 45, 0.85);
                border: 1px solid rgba(0, 229, 255, 0.3);
                box-shadow:
                    0 0 20px rgba(0, 229, 255, 0.15),
                    inset 0 0 20px rgba(0, 229, 255, 0.05);
                backdrop-filter: blur(8px);
            }

            .status-value {
                font-size: 1.4rem;
                font-weight: bold;
            }

            .offline {
                color: #ff4f4f;
            }

            .online {
                color: #00ff9d;
            }

            .metric-card {
                background: rgba(9, 15, 30, 0.85);
                border: 1px solid rgba(0, 229, 255, 0.15);
            }

            .objective-item {
                font-size: 1.1rem;
                padding: 10px;
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.04);
                margin-bottom: 10px;
                color: white;
            }

            .jarvis-border {
                height: 2px;
                background: linear-gradient(to right, transparent, #00e5ff, transparent);
            }

            .pulse {
                animation: pulse 1.5s infinite;
            }

            @keyframes pulse {
                0% {
                    opacity: 0.6;
                }

                50% {
                    opacity: 1;
                }

                100% {
                    opacity: 0.6;
                }
            }
        </style>
    </head>

    <body>
        <div class="container py-5">
            <!-- Header -->
            <div class="text-center mb-4">
                <!--<h5 class="text-info mb-1">STARK LABS</h5>-->
                <img src="{{ url_for('static', filename='images/Logo_StarkLabs_White.png') }}"alt="JARVIS">
                <h1 class="stark-title">JARVIS KNOWLEDGE MATRIX DATABASE</h1>
            </div>

            <div class="jarvis-border mb-4"></div>

            <div class="row g-4">
                <!-- System Status -->
                <div class="col-lg-6">
                    <div class="card jarvis-card h-100">
                        <div class="card-header bg-transparent border-info">
                            <h4 class="mb-0 text-info">System Status</h4>
                        </div>

                        <div class="card-body">
                            <div class="row g-3">
                                <!-- Database Server -->
                                <div class="col-md-6">
                                    <div class="card metric-card h-100">
                                        <div class="card-body">
                                            <h6 class="text-secondary">Database Server</h6>

                                            <div class="status-value offline pulse database-server-status">
                                                🔴 OFFLINE
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Database -->
                                <div class="col-md-6">
                                    <div class="card metric-card h-100">
                                        <div class="card-body">
                                            <h6 class="text-secondary">Database</h6>

                                            <div class="status-value offline pulse database-exist-status">
                                                🔴 MISSING
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Tables -->
                                <div class="col-md-6">
                                    <div class="card metric-card h-100">
                                        <div class="card-body">
                                            <h6 class="text-secondary">Tables</h6>

                                            <div class="display-5 text-info total-tables">0</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Records -->
                                <div class="col-md-6">
                                    <div class="card metric-card h-100">
                                        <div class="card-body">
                                            <h6 class="text-secondary">Records</h6>

                                            <div class="display-5 text-info table-records">0</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <hr />

                            <!--<div class="alert alert-danger mt-3 mb-0">
                    <strong>⚠ ATTACK DETECTED</strong>
                    <br>
                    Database server unreachable.
                    JARVIS Knowledge Matrix appeared to be missing.
                </div>-->
                        </div>
                    </div>
                </div>

                <!-- Mission Objectives -->
                <div class="col-lg-3">
                    <div class="card jarvis-card h-100">
                        <div class="card-header bg-transparent border-info">
                            <h4 class="mb-0 text-info">Mission Objectives</h4>
                        </div>

                        <div class="card-body">
                            <div class="objective-item connected">☐ Connect to Server</div>

                            <div class="objective-item restored">☐ Restore Database</div>

                            <div class="objective-item validated">☐ Validate Records</div>

                            <div class="mt-4">
                                <h6 class="text-secondary">Mission Progress</h6>

                                <div class="progress bg-dark">
                                    <div
                                        class="progress-bar bg-info"
                                        role="progressbar"
                                        style="width: 0%"
                                        aria-valuenow="0"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >
                                        0%
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3">
                    <div class="card jarvis-card h-100">
                        <div class="card-header bg-transparent border-info">
                            <h4 class="mb-0 text-info">Recovery Console</h4>
                        </div>

                        <div class="card-body">
                            <a
                                href="http://{{database_host}}"
                                class="btn btn-success"
                                target="_blank"
                                rel="noopener noreferrer"
                                >Launch Recovery Console Panel</a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            //set the set the host to point to the database server host

            //async function to fetch the database ping status from the backend every 1 second and update the UI accordingly
            async function fetchDatabasePingStatus() {
                try {
                    const response = await fetch('/api/database/ping');
                    const data = await response.json();
                    // Update the UI with the fetched data
                    const statusElement = document.querySelector('.database-server-status');
                    if (data.reachable) {
                        statusElement.textContent = '🟢 ONLINE';
                        statusElement.classList.remove('offline');
                        statusElement.classList.add('online');

                        //update the mission objective to connected
                        const objectiveElement = document.querySelector('.objective-item.connected');
                        objectiveElement.textContent = '☑ Connect to Server';
                        objectiveElement.classList.add('completed');
                    } else {
                        statusElement.textContent = '🔴 OFFLINE';
                        statusElement.classList.remove('online');
                        statusElement.classList.add('offline');

                        //update the mission objective to not connected
                        const objectiveElement = document.querySelector('.objective-item.connected');
                        objectiveElement.textContent = '☐ Connect to Server';
                        objectiveElement.classList.remove('completed');
                    }
                } catch (error) {
                    console.error('Error fetching database ping status:', error);
                }
            }

            // Call the function every 1 second
            setInterval(fetchDatabasePingStatus, 1000);

            async function fetchDatabaseExistsStatus() {
                try {
                    const response = await fetch('/api/database/exists');
                    const data = await response.json();
                    // Update the UI with the fetched data
                    const statusElement = document.querySelector('.database-exist-status');
                    if (data.exists) {
                        statusElement.textContent = '🟢 PRESENT';
                        statusElement.classList.remove('offline');
                        statusElement.classList.add('online');

                        //update the mission objective to exist
                        const objectiveElement = document.querySelector('.objective-item.restored');
                        objectiveElement.textContent = '☑ Restore Database';
                        objectiveElement.classList.add('completed');
                    } else {
                        statusElement.textContent = '🔴 MISSING';
                        statusElement.classList.remove('online');
                        statusElement.classList.add('offline');

                        //update the mission objective to not exist
                        const objectiveElement = document.querySelector('.objective-item.restored');
                        objectiveElement.textContent = '☐ Restore Database';
                        objectiveElement.classList.remove('completed');
                    }
                } catch (error) {
                    console.error('Error fetching database exists status:', error);
                }
            }

            // Call the function every 1 second
            setInterval(fetchDatabaseExistsStatus, 1000);

            async function fetchDatabaseTablesAndRecords() {
                try {
                    const tablesResponse = await fetch('/api/database/tables');
                    const tablesData = await tablesResponse.json();
                    const rowCountsResponse = await fetch('/api/database/row_counts');
                    const rowCountsData = await rowCountsResponse.json();

                    // Update the UI with the fetched data
                    const totalTablesElement = document.querySelector('.total-tables');
                    totalTablesElement.textContent = tablesData.tables.length;

                    const totalRecordsElement = document.querySelector('.table-records');
                    totalRecordsElement.textContent = rowCountsData.row_counts;

                    //update the missions objectives based on the number of tables and records
                    const objectiveElement = document.querySelector('.objective-item.validated');
                    if (tablesData.tables.length > 0 && rowCountsData.row_counts > 0) {
                        objectiveElement.textContent = '☑ Validate Records';
                        objectiveElement.classList.add('completed');
                    } else {
                        objectiveElement.textContent = '☐ Validate Records';
                        objectiveElement.classList.remove('completed');
                    }
                } catch (error) {
                    console.error('Error fetching database tables and records:', error);

                    //update the mission objective to not be validated
                    const objectiveElement = document.querySelector('.objective-item.validated');
                    objectiveElement.textContent = '☐ Validate Records';
                    objectiveElement.classList.remove('completed');
                }
            }

            // Call the function every 1 second
            setInterval(fetchDatabaseTablesAndRecords, 1000);

            async function fetchIsDatabaseRestored() {
                try {
                    const isRestoredResponse = await fetch('/api/database/is_restored');
                    const isRestoredData = await isRestoredResponse.json();
                    console.log('Database is restored status:', isRestoredData.is_restored);
                } catch (error) {
                    console.error('Error fetching database is restored status:', error);
                }
            }

            // Call the function every 1 second
            setInterval(fetchIsDatabaseRestored, 1000);
        </script>
    </body>
</html>
