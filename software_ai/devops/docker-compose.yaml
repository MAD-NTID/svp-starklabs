services:

  prometheus:
    image: prom/prometheus:latest
    container_name: starklab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus


  grafana:
    image: grafana/grafana:latest
    container_name: starklab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: StarkLab2026!
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus


  node-exporter:
    image: prom/node-exporter:latest
    container_name: starklab-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: starklab-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro


volumes:
  prometheus_data:
  grafana_data: