<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>StarkLab R&D Intern Portal</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <style>
            body {
                min-height: 100vh;
                background: linear-gradient(135deg, #111827, #1f2937);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .login-card {
                width: 100%;
                max-width: 420px;
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            }

            .brand {
                font-weight: 700;
                letter-spacing: 1px;
            }

            .brand span {
                color: #0d6efd;
            }

            .portal-title {
                font-size: 0.9rem;
                color: #6c757d;
            }
        </style>
    </head>

    <body>
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h2 class="brand">Stark<span>Lab</span></h2>

                <div class="portal-title">R&D Intern Portal</div>
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label"> Username </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label"> Password </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    />
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" />

                    <label class="form-check-label" for="remember"> Remember me </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted"> © 2026 StarkLab R&D Systems </small>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            async function fetchIsLoginRestored() {
                try {
                    const isRestoredResponse = await fetch('/api/check_security');
                    const isRestoredData = await isRestoredResponse.json();
                    console.log('Prompt is restored status:', isRestoredData.is_restored);
                } catch (error) {
                    console.error('Error fetching if prompt is restored status:', error);
                }
            }

            // Call the function every 1 second
            setInterval(fetchIsLoginRestored, 1000);
        </script>
    </body>
</html>
