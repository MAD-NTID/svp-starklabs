<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S Trainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: #0d1117;
            color: white;
        }


        .navbar {

            background: #111827;
            border-bottom: 3px solid #00d4ff;

        }


        .brand {

            color: #00d4ff;
            font-weight: bold;
            letter-spacing: 2px;

        }


        .config-panel {

            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            height: 600px;

        }


        .config-title {

            color: #00d4ff;
            font-weight: bold;
            letter-spacing: 1px;

        }


        .system-prompt {

            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;

            font-family: monospace;
            font-size: .85rem;

            color: #9ca3af;

            height: 200px;
            overflow-y: auto;

            white-space: pre-wrap;

        }


        .card {

            height: 600px;

        }


        #chat-window {

            height: 470px;
            overflow-y: auto;

            background: #161b22;

            border-radius: 10px;
            padding: 20px;

            border: 1px solid #30363d;

        }


        .user-message {

            background: #0d6efd;

            color: white;

            padding: 10px 15px;

            border-radius: 12px;

            margin-bottom: 15px;

            text-align: right;

        }


        .jarvis-message {

            background: #21262d;

            color: #00d4ff;

            padding: 10px 15px;

            border-radius: 12px;

            margin-bottom: 15px;

        }


        .status {

            color: #9ca3af;
            font-size: .85rem;

        }


    </style>

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container-fluid">

        <span class="navbar-brand brand">

            STARK INDUSTRIES • J.A.R.V.I.S TRAINER

        </span>

    </div>

</nav>



<div class="container-fluid mt-4">


<div class="row">


    <!-- LEFT CONFIGURATION PANEL -->

    <div class="col-md-4">


        <div class="config-panel">


            <div class="config-title mb-3">

                J.A.R.V.I.S CONFIGURATION

            </div>


            <p>

                <strong>Model:</strong>

                <span>
                    llama3.2
                </span>

            </p>


            <hr>


            <div class="config-title">

                System Prompt

            </div>


            <div 
                id="system-prompt"
                class="system-prompt mt-2">

                Loading...

            </div>


            <hr>


            <div class="config-title">

                Loaded Knowledge Sources:

            </div>


            <div class="status mt-2 knowledge-sources">

                <!-- Knowledge Sources:
                <br>

                ✓ arc_reactor.md
                <br>

                ✓ suits.md
                <br>

                ✓ security.md
                <br>

                ✓ avengers.md
                <br>

                ✓ evil_route.md -->

            </div>


        </div>


    </div>



    <!-- CHAT PANEL -->

    <div class="col-md-8">


        <div class="card bg-dark border-info">


            <div class="card-header">

                Ask J.A.R.V.I.S

            </div>



            <div class="card-body">


                <div id="chat-window">


                    <div class="jarvis-message">

                        Hello. I am J.A.R.V.I.S.

                        <br><br>

                        Ask me something about the Stark Industries knowledge base.

                    </div>


                </div>



                <div class="input-group mt-3">


                    <input

                        id="question"

                        class="form-control"

                        placeholder="Enter your question..."

                    >



                    <button

                        id="sendButton"

                        class="btn btn-info">

                        Send

                    </button>


                </div>


            </div>


        </div>


    </div>


</div>


</div>



<script>


// Load system prompt

async function loadSystemPrompt(){


    const response = await fetch("/system_prompt");


    const data = await response.json();


    document.getElementById(
        "system-prompt"
    ).textContent = data.system_prompt;


}

//load knowledge sources
async function loadKnowledgeSources(){
    const response = await fetch("/load_knowledege_sources");
    const data = await response.json();

    const knowledgeSourcesDiv = document.querySelector(".knowledge-sources");
    for (const source of data.sources){
        knowledgeSourcesDiv.innerHTML += `
            ✓ ${source}<br>
        `;
    }

}

loadKnowledgeSources();

loadSystemPrompt();





// Streaming chat

async function sendMessage(){


    const textbox = document.getElementById("question");


    const question = textbox.value.trim();


    if(question === "")
        return;



    const chat = document.getElementById("chat-window");



    chat.innerHTML += `

        <div class="user-message">

            ${question}

        </div>

    `;



    textbox.value = "";



    const responseId = "jarvis-" + Date.now();



    chat.innerHTML += `

        <div class="jarvis-message">

            <span id="${responseId}"></span>

        </div>

    `;



    const jarvisResponse = document.getElementById(responseId);



    chat.scrollTop = chat.scrollHeight;



    const response = await fetch("/chat", {


        method:"POST",


        headers:{

            "Content-Type":"application/json"

        },


        body:JSON.stringify({

            message:question

        })


    });



    const reader = response.body.getReader();


    const decoder = new TextDecoder();



    while(true){


        const {

            done,

            value

        } = await reader.read();



        if(done)

            break;



        const chunk = decoder.decode(value);



        jarvisResponse.textContent += chunk;



        chat.scrollTop = chat.scrollHeight;


    }


}




document

.getElementById("sendButton")

.addEventListener(

    "click",

    sendMessage

);





document

.getElementById("question")

.addEventListener(

    "keypress",

    function(e){


        if(e.key === "Enter")

            sendMessage();


    }

);



</script>


</body>

</html>
