      none_complete: Offline

  networks:
    title: Networks
    icon: fa-network-wired
    tasks:
      - id: router_reachable
        description: "Router is reachable"
        type: ping
        host: 192.168.1.1
      - id: switch_online
        description: "Switch is online"
        type: ping
        host: 192.168.10.27
