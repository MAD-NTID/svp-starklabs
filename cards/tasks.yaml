cards:
  devices:
    title: Devices
    icon: fa-microchip
    tasks:
      - id: printer_online
        description: "Printer is online"
        type: port
        host: 192.168.2.13
        port: 9100
      - id: authentik_online
        description: "Authentik is online"
        type: port
        host: 192.168.2.115
        port: 9443
